<script>
const phone = "994558530802";

// Shopping cart data
let cartItems = [];
let total = 0;
let cartOpen = false;

// HTML Elements
const cartPanel = document.getElementById("cart");
const overlay = document.getElementById("overlay");
const items = document.getElementById("items");
const totalEl = document.getElementById("total");
const countEl = document.getElementById("count");
const searchInput = document.getElementById("search");

// Add to Cart
function add(name, price){
    cartItems.push({name, price});
    total += price;
    renderCart();
}

// Render Cart
function renderCart(){

    countEl.textContent = cartItems.length;

    totalEl.textContent = total.toFixed(2);

    if(cartItems.length === 0){
        items.innerHTML = "<p>Your cart is empty.</p>";
        return;
    }

    items.innerHTML = cartItems.map((item,index)=>`
        <p>
            ${item.name} - $${item.price.toFixed(2)}
            <button onclick="removeItem(${index})">❌</button>
        </p>
    `).join("");

}

// Remove
function removeItem(index){

    total -= cartItems[index].price;

    cartItems.splice(index,1);

    renderCart();

}

// Open/Close Cart
function toggleCart(){

    cartOpen = !cartOpen;

    cartPanel.style.right = cartOpen ? "0" : "-380px";

    overlay.style.display = cartOpen ? "block" : "none";

}

// WhatsApp Checkout
function checkout(){

    if(cartItems.length===0){
        alert("Your cart is empty.");
        return;
    }

    let msg="🎮 NexaVault Order\n\n";

    cartItems.forEach(item=>{
        msg += `${item.name} - $${item.price.toFixed(2)}\n`;
    });

    msg += `\nTotal: $${total.toFixed(2)}`;

    window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
        "_blank"
    );

}

// Search
function searchGames(){

    let q = searchInput.value.toLowerCase();

    document.querySelectorAll(".card").forEach(card=>{

        let title = card.querySelector("h3").innerText.toLowerCase();

        card.style.display =
            title.includes(q)
            ? "block"
            : "none";

    });

}

// Initialize
renderCart();

</script>
