<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GameVault</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#171a21;color:#c7d5e0}
nav{background:#1b2838;padding:15px 25px;display:flex;justify-content:space-between;align-items:center}
nav a{color:#c7d5e0;text-decoration:none;margin-left:15px}
.hero{padding:80px 20px;text-align:center;background:linear-gradient(135deg,#1b2838,#2a475e)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding:20px}
.card{background:#1b2838;border-radius:10px;padding:15px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
button{background:#66c0f4;border:none;padding:10px 14px;border-radius:6px;cursor:pointer}
.search{margin:20px;padding:10px;width:min(400px,90%)}
#cart{position:fixed;right:0;top:0;width:320px;height:100%;background:#111;padding:15px;overflow:auto;display:none}
</style>
</head>
<body>
<nav>
<div><b>GameVault</b></div>
<div>
<a href="#home">Home</a>
<a href="#games">Games</a>
<a href="#about">About</a>
<a href="#" onclick="toggleCart()">Cart (<span id="count">0</span>)</a>
</div>
</nav>

<section class="hero" id="home">
<h1>GameVault Store</h1>
<p>Steam-inspired gaming storefront</p>
</section>

<div style="text-align:center">
<input class="search" id="search" placeholder="Search games..." onkeyup="searchGames()">
</div>

<section id="games" class="grid">
<div class="card"><img src="https://picsum.photos/400/250?1"><h3>Cyber Quest</h3><p>$29.99</p><button onclick="add('Cyber Quest',29.99)">Add</button></div>
<div class="card"><img src="https://picsum.photos/400/250?2"><h3>Space Arena</h3><p>$19.99</p><button onclick="add('Space Arena',19.99)">Add</button></div>
<div class="card"><img src="https://picsum.photos/400/250?3"><h3>Battle Legends</h3><p>$39.99</p><button onclick="add('Battle Legends',39.99)">Add</button></div>
<div class="card"><img src="https://picsum.photos/400/250?4"><h3>Pixel Adventure</h3><p>$14.99</p><button onclick="add('Pixel Adventure',14.99)">Add</button></div>
</section>

<section id="about" style="padding:30px">
<h2>About</h2>
<p>GameVault is a Steam-inspired storefront demo with cart and WhatsApp checkout.</p>
</section>

<div id="cart">
<h2>Cart</h2>
<div id="items"></div>
<h3>Total: $<span id="total">0</span></h3>
<button onclick="checkout()">Checkout via WhatsApp</button>
<button onclick="toggleCart()">Close</button>
</div>

<script>
const phone="994558530802";
let cart=[];
let total=0;

function add(name,price){
 cart.push({name,price});
 total+=price;
 renderCart();
}

function renderCart(){
 document.getElementById('count').innerText=cart.length;
 document.getElementById('total').innerText=total.toFixed(2);
 document.getElementById('items').innerHTML=cart.map((i,idx)=>
 `<p>${i.name} - $${i.price.toFixed(2)} <a href="#" onclick="removeItem(${idx})">X</a></p>`).join('');
}

function removeItem(i){
 total-=cart[i].price;
 cart.splice(i,1);
 renderCart();
}

function toggleCart(){
 const c=document.getElementById('cart');
 c.style.display=c.style.display==='block'?'none':'block';
}

function checkout(){
 let msg='GameVault Order\n';
 cart.forEach(i=>msg+=`${i.name} - $${i.price}\n`);
 msg+=`Total: $${total.toFixed(2)}`;
 window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
}

function searchGames(){
 const q=document.getElementById('search').value.toLowerCase();
 document.querySelectorAll('.card').forEach(c=>{
  c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
 });
}
</script>
</body>
</html>
